<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>Roast chicken</title>
<meta name="description" content="Roast chicken menu · منيو روست تشكن">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Kaushan+Script&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#ffffff;
  --bg-2:#f7faf3;
  --card:#ffffff;
  --card-2:#f1f6ec;
  --line:#e2e9da;
  --green:#7ac23a;
  --green-hi:#8fd34d;
  --green-text:#3d8612;
  --green-soft:#eef7e5;
  --green-ink:#10200a;
  --red:#e2261c;
  --ink:#141615;
  --white:#ffffff;
  --text:#18201a;
  --muted:#5d685e;
  --wa:#25d366;
  --display:"Baloo Bhaijaan 2","Readex Pro",system-ui,sans-serif;
  --script:"Kaushan Script","Brush Script MT",cursive;
  --body:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
img{max-width:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.wrap{max-width:1100px;margin-inline:auto;padding-inline:16px}

/* ---------- Hero ---------- */
.hero{position:relative;padding-block:14px 0;overflow:hidden;
  padding-bottom:26px;border-bottom:1px solid var(--line);
  background:radial-gradient(55% 50% at 50% 40%,rgba(122,194,58,.20),transparent 72%),
             radial-gradient(35% 25% at 85% 8%,rgba(226,38,28,.08),transparent 70%),
             linear-gradient(180deg,#f4faee,var(--bg) 70%)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative;z-index:2}
.hi{font-family:var(--display);font-weight:700;color:var(--green-text);font-size:14px;letter-spacing:.2px}
.lang{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.lang button{border:0;background:none;color:var(--muted);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600}
.lang button[aria-pressed="true"]{background:var(--green);color:var(--green-ink)}
.lang{box-shadow:0 2px 8px rgba(20,22,21,.06)}
.badge{position:relative;width:min(320px,82vw);aspect-ratio:1;margin:14px auto 0}
.ring{position:absolute;inset:0;width:100%;height:100%;animation:spin 38s linear infinite}
.ring text{font-family:var(--display);font-weight:800;font-size:14px;fill:#4f9a1c}
.ring .dot{fill:var(--red)}
@keyframes spin{to{transform:rotate(360deg)}}
.logo{position:absolute;inset:15%;width:70%;height:70%;border-radius:50%;object-fit:cover;box-shadow:0 0 0 6px var(--white),0 18px 44px rgba(20,22,21,.28)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1{margin:0;font-weight:400}
.w-roast{display:block;font-family:var(--script);color:var(--green);font-size:clamp(46px,12vw,72px);line-height:1.05;transform:rotate(-4deg)}
.w-chicken{display:block;font-family:var(--display);font-weight:800;color:var(--white);font-size:clamp(24px,6vw,34px);letter-spacing:1px;margin-top:-4px}
.tag{margin:16px auto 0;padding-inline:16px;font-size:15px;font-weight:600;text-align:center;color:var(--text);max-width:40ch;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;background:var(--white);border:1px solid var(--line);color:var(--text);font-size:13px;font-weight:500;text-decoration:none;white-space:nowrap}
.pill svg{width:15px;height:15px;flex:none}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.is-open .pdot{background:var(--green);box-shadow:0 0 0 3px rgba(122,194,58,.25)}
.is-closed .pdot{background:var(--red)}

/* ---------- Sticky nav ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin-top:0;box-shadow:0 6px 16px rgba(20,22,21,.04)}
.search{display:flex;align-items:center;gap:8px;margin-top:10px;background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding-inline:12px}
.search:focus-within{border-color:var(--green)}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;padding-block:10px;font-size:15px}
.search input::placeholder{color:var(--muted)}
.clear{background:none;border:0;color:var(--muted);padding:4px;font-size:20px;line-height:1}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs.more{-webkit-mask-image:linear-gradient(to var(--fade),#000 84%,transparent);mask-image:linear-gradient(to var(--fade),#000 84%,transparent)}
.tab{flex:none;display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;transition:background .15s,color .15s}
.tab svg{width:17px;height:17px;color:var(--green-text)}
.tab[aria-current="true"]{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.tab[aria-current="true"] svg{color:var(--green-ink)}
@media (min-width:820px){.tabs{flex-wrap:wrap;justify-content:center}.tabs.more{-webkit-mask-image:none;mask-image:none}}

/* ---------- Boards ---------- */
main{padding-block:10px 130px}
.boards{columns:1;column-gap:18px}
@media (min-width:900px){.boards{columns:2}}
.board{break-inside:avoid;margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;position:relative;box-shadow:0 10px 30px rgba(20,22,21,.06)}
.bhead{display:flex;align-items:center;gap:12px;padding:16px 18px 12px;border-bottom:1px dashed var(--line);background:linear-gradient(180deg,var(--green-soft),transparent)}
.ico{width:48px;height:48px;border-radius:50%;background:var(--green);color:var(--green-ink);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 3px var(--white),0 0 0 2px var(--green)}
.ico svg{width:26px;height:26px}
.btitle{flex:1;min-width:0}
h2{margin:0;font-family:var(--display);font-weight:800;font-size:25px;line-height:1.15;color:var(--ink)}
h2::after{content:"";display:block;width:34px;height:4px;border-radius:4px;background:var(--red);margin-top:5px}
.balt{font-size:12px;color:var(--muted);font-weight:500}
.cnt{font-size:12px;color:var(--green-text);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.rows{list-style:none;margin:0;padding:4px 18px 8px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding-block:13px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.thumb{width:62px;height:62px;border-radius:14px;object-fit:cover;flex:none;border:0;padding:0;background:var(--card-2);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.nm{flex:1 1 150px;min-width:0}
.nm b{display:block;font-weight:600;font-size:16px;line-height:1.4}
.nm small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-inline-start:auto}
.opt{position:relative;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--green);background:var(--white);color:var(--text);border-radius:12px;padding:5px 6px 5px 11px;min-height:40px;transition:background .15s,transform .1s}
[dir="rtl"] .opt{padding:5px 11px 5px 6px}
.opt:active{transform:scale(.95)}
.opt .ol{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1}
.opt .op{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.opt .op small{font-size:11px;font-weight:600;margin-inline-start:2px}
.opt .plus{width:26px;height:26px;border-radius:8px;background:var(--green);color:var(--green-ink);display:grid;place-items:center;font-weight:800;font-size:17px;line-height:1}
.opt .lp{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.opt.on{background:var(--green);color:var(--green-ink)}
.opt.on .ol{color:var(--green-ink);opacity:.75}
.opt.on .plus{background:var(--green-ink);color:var(--green)}
.qty{position:absolute;top:-8px;inset-inline-end:-8px;min-width:22px;height:22px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding-inline:6px;box-shadow:0 0 0 2px var(--card)}
.empty{padding:56px 0;text-align:center;color:var(--muted)}
mark{background:rgba(122,194,58,.28);color:var(--green-ink);border-radius:3px}

/* ---------- Cart ---------- */
.cartbar{position:fixed;inset-inline:0;bottom:0;z-index:30;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.cartbar button{pointer-events:auto;width:100%;max-width:560px;margin-inline:auto;display:flex;align-items:center;gap:12px;border:0;border-radius:18px;background:var(--green);color:var(--green-ink);padding:12px 16px;font-weight:800;font-size:16px;box-shadow:0 12px 30px rgba(20,22,21,.25);animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(20px);opacity:.4}to{transform:none;opacity:1}}
.cartbar .n{background:var(--red);color:#fff;border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-size:14px;padding-inline:8px}
.cartbar .l{flex:1;text-align:start}
.cartbar .s{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,10px);z-index:35;background:var(--ink);color:#fff;font-weight:700;border-radius:999px;padding:8px 16px;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

.scrim{position:fixed;inset:0;z-index:40;background:rgba(20,22,21,.5);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:relative;width:100%;max-width:560px;background:var(--bg-2);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;max-height:92vh;overflow:auto;transform:translateY(28px);transition:transform .22s;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.scrim.show .sheet{transform:none}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:26px;border-bottom:1px solid var(--line);padding-bottom:18px}}
.x{width:38px;height:38px;border-radius:50%;border:0;background:var(--card-2);color:var(--text);font-size:20px;line-height:1;flex:none}
.big{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--card-2)}
.x.float{position:absolute;top:12px;inset-inline-end:12px;background:rgba(255,255,255,.9);color:var(--ink)}
.pad{padding:16px 20px 0;display:grid;gap:12px}
.sheet h3{margin:0;font-family:var(--display);font-weight:800;font-size:26px;line-height:1.2}
.shead{padding:18px 20px 6px;display:flex;align-items:center;gap:10px}
.shead h3{flex:1}
.link{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px}
.lines{list-style:none;margin:0;padding:0 20px}
.line{display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.line .ln{flex:1;min-width:0;font-weight:600;font-size:14.5px;line-height:1.4}
.line .ln small{display:block;color:var(--muted);font-weight:500;font-size:12.5px;font-variant-numeric:tabular-nums}
.step{display:inline-flex;align-items:center;background:var(--card-2);border:1px solid var(--line);border-radius:999px;height:36px;flex:none}
.step button{width:34px;height:34px;border:0;background:none;color:var(--green-text);font-size:20px;font-weight:800;line-height:1}
.step b{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:10px;padding:9px 6px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--green-ink)}
.field{display:grid;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.field input,.field textarea{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;outline:0;width:100%;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--green)}
.field.bad input,.field.bad textarea{border-color:var(--red)}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:18px}
.total span:last-child{color:var(--green-text);font-size:24px;font-variant-numeric:tabular-nums}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:14px;padding:14px 16px;font-weight:800;font-size:16px}
.btn-wa{background:var(--wa);color:#fff}
.btn-wa svg{width:22px;height:22px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.note{font-size:12.5px;color:var(--muted);text-align:center;margin:0}
.warn{background:#fde6e4;color:#a52018;border-radius:12px;padding:10px 12px;font-size:13px}

/* ---------- Footer ---------- */
footer{position:relative;background:var(--green-soft);border-top:1px solid var(--line);padding-block:34px 140px;color:var(--muted);font-size:14px;overflow:hidden}
footer::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--green) 0 75%,var(--red) 75%)}
.fgrid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));align-items:start}
.fbrand{display:flex;align-items:center;gap:12px}
.fbrand img{width:64px;height:64px;border-radius:50%}
.fbrand b{font-family:var(--script);color:var(--green-text);font-size:28px;font-weight:400;line-height:1}
.fbrand span{display:block;color:var(--ink);font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.5px}
footer h4{margin:0 0 6px;font-family:var(--display);font-weight:800;color:var(--ink);font-size:17px}
footer p{margin:0}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.fnote{margin-top:24px;font-size:12px;text-align:center}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap top">
    <span class="hi" id="t-hi"></span>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ar" aria-pressed="false">العربية</button>
      <button type="button" data-lang="tr" aria-pressed="false">Türkçe</button>
    </div>
  </div>
  <div class="badge">
    <svg class="ring" viewBox="0 0 300 300" aria-hidden="true" direction="ltr" style="direction:ltr">
      <defs><path id="circ" d="M150,150 m-134,0 a134,134 0 1,1 268,0 a134,134 0 1,1 -268,0"/></defs>
      <text direction="ltr"><textPath href="#circ" startOffset="0" textLength="836" lengthAdjust="spacing">ROAST CHICKEN ● BROASTED ● DÖNER ● BURGER ● ROAST CHICKEN ● BROASTED ● DÖNER ● BURGER ●</textPath></text>
    </svg>
    <img class="logo" src="logo.webp" alt="Roast chicken">
  </div>
  <h1 class="sr">Roast chicken</h1>
  <p class="tag" id="t-tag"></p>
  <div class="wrap meta" id="meta">
    <span class="pill" id="status" hidden><span class="pdot"></span><span id="status-t"></span></span>
    <a class="pill" id="addr-pill" hidden target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span id="addr-t"></span></a>
  </div>
</header>

<div class="bar" id="bar">
  <div class="wrap">
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off">
      <button class="clear" id="clear" type="button" hidden>×</button>
    </label>
    <nav class="tabs" id="tabs"></nav>
  </div>
</div>

<main class="wrap"><div class="boards" id="menu"></div></main>

<footer>
  <div class="wrap">
    <div class="fgrid">
      <div class="fbrand"><img src="logo.webp" alt=""><div><b>Roast</b><span>chicken</span></div></div>
      <div id="f-hours" hidden><h4 id="t-hours-h"></h4><p id="t-hours"></p></div>
      <div id="f-addr" hidden><h4 id="t-addr-h"></h4><p id="f-addr-t"></p><div class="links"><a class="pill" id="f-map" hidden target="_blank" rel="noopener"></a></div></div>
      <div id="f-contact" hidden><h4 id="t-contact-h"></h4><p id="f-contact-t"></p></div>
      <div id="f-social" hidden><h4 id="t-follow"></h4><div class="links" id="f-social-l"></div></div>
    </div>
    <p class="fnote" id="t-prices"></p>
  </div>
</footer>

<div class="toast" id="toast" role="status"></div>
<div class="cartbar" id="cartbar" hidden><button type="button" id="open-cart"><span class="n" id="cb-n">0</span><span class="l" id="cb-l"></span><span class="s" id="cb-s"></span></button></div>

<div class="scrim" id="img-scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="v-name">
    <button class="x float" type="button" data-close aria-label="×">×</button>
    <img class="big" id="v-img" alt="">
    <div class="pad"><h3 id="v-name"></h3><div class="opts" id="v-opts" style="margin-inline-start:0"></div></div>
  </div>
</div>

<div class="scrim" id="cart-scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="c-title">
    <div class="shead"><h3 id="c-title"></h3><button class="link" type="button" id="c-clear"></button><button class="x" type="button" data-close aria-label="×">×</button></div>
    <ul class="lines" id="c-lines"></ul>
    <div class="pad">
      <div class="seg" id="c-type" role="group"></div>
      <div class="field" id="f-table"><label for="in-table" id="l-table"></label><input id="in-table" inputmode="numeric"></div>
      <div class="field" id="f-name"><label for="in-name" id="l-name"></label><input id="in-name" autocomplete="name"></div>
      <div class="field" id="f-adr"><label for="in-addr" id="l-addr"></label><textarea id="in-addr" rows="2" autocomplete="street-address"></textarea></div>
      <div class="field"><label for="in-note" id="l-note"></label><textarea id="in-note" rows="2"></textarea></div>
      <div class="total"><span id="t-total"></span><span id="c-sum"></span></div>
      <div class="warn" id="c-nowa" hidden></div>
      <button class="btn btn-wa" type="button" id="c-send"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3c-.3.3-1 1-1 2.3s1 2.7 1.2 2.9c.1.2 2 3.1 4.9 4.3 1.8.8 2.5.8 3.4.7.6-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg><span id="c-send-t"></span></button>
      <p class="note" id="c-hint"></p>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
/* ============ Config & Dynamic Sheet Fetch ============ */

function iconFor(name){
  const k = /فروج|دجاج/.test(name) ? "chicken" : /برغر|همبرغر|برجر/.test(name) ? "burger" : /سندويش|ساندويش/.test(name) && !/شاورما/.test(name) ? "wrap"
          : /شاورما/.test(name) ? "doner" : /غربي|وجبات/.test(name) ? "meal" : /مشروب/.test(name) ? "drink" : "sides";
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]}</svg>`;
}

function hash(s){ let h = 5381; for (const ch of s) h = ((h<<5)+h + ch.codePointAt(0)) >>> 0; return h.toString(36); }
function driveImg(u){
  u = String(u||"").trim(); if (!u) return "";
  const m = u.match(/\/d\/([\w-]{20,})/) || u.match(/[?&]id=([\w-]{20,})/);
  return m ? `https://lh3.googleusercontent.com/d/${m[1]}=w800` : (/^https?:\/\//.test(u) ? u : "");
}
function imgFail(el){ const m = el.src.match(/\/d\/([\w-]{20,})/);
  if (m && !el.dataset.tried){ el.dataset.tried = 1; el.src = `https://drive.google.com/thumbnail?id=${m[1]}&sz=w800`; return; }
  const box = el.closest(".thumb"); if (box) box.remove(); else el.remove(); }

// دالة تحليل ملف الـ CSV القادم من جوجل شيت
function parseCSV(text) {
  let lines = [];
  let row = [];
  let inQuotes = false;
  let currentField = "";
  
  for (let i = 0; i < text.length; i++) {
    let c = text[i];
    let nextC = text[i + 1];
    if (c === '"') {
      if (inQuotes && nextC === '"') {
        currentField += '"';
        i++;
      } else {
        inQuotes = !inQuotes;
      }
    } else if (c === ',' && !inQuotes) {
      row.push(currentField);
      currentField = "";
    } else if ((c === '\r' || c === '\n') && !inQuotes) {
      if (c === '\r' && nextC === '\n') { i++; }
      row.push(currentField);
      if (row.length > 1 || row[0] !== "") { lines.push(row); }
      row = [];
      currentField = "";
    } else {
      currentField += c;
    }
  }
  if (currentField !== "" || row.length > 0) {
    row.push(currentField);
    lines.push(row);
  }
  return lines;
}

function build(rows){
  const cats = [], cmap = {}; OPT = {};
  rows.forEach(r => {
    // نتأكد أن السطر يحتوي على أعمدة كافية وألا يكون صف العنوان الرئيسي
    if (!r || r.length < 6) return;
    const [c, ct, n, nt, o, p, img] = r;
    if (!c || c.trim() === "" || c.includes("القسم")) return; // تخطي رأس الصفحة
    
    if (!cmap[c]){ cmap[c] = {name:c, tr:ct||"", slug:"c"+cats.length, items:[], imap:{}}; cats.push(cmap[c]); }
    const cat = cmap[c]; if (!cat.tr && ct) cat.tr = ct;
    const key = hash(n+":"+(nt||""));
    if (!cat.imap[key]){
      const it = {n, t:nt||"", img:driveImg(img), opts:[], slug:cat.slug+"-"+cat.items.length};
      cat.imap[key] = it; cat.items.push(it);
    }
    const item = cat.imap[key];
    if (o) item.opts.push({o, p:Number(p)||0}); else item.opts.push({o:"", p:Number(p)||0});
    if (o) OPT[o] = 1;
  });
  CATS = cats;
}

function renderTabs(){
  const html = CATS.map((c, i) => `<button class="tab" type="button" data-to="${c.slug}" ${i===0?'aria-current="true"':""}>${iconFor(c.name)}<span>${esc(cn(c))}</span></button>`).join("");
  $("#tabs").innerHTML = html;
}
function renderMenu(filter=""){
  const f = norm(filter);
  const html = CATS.map(c => {
    const items = c.items.filter(it => !f || norm(it.n).includes(f) || norm(it.t).includes(f) || norm(c.name).includes(f) || norm(c.tr).includes(f));
    if (!items.length) return "";
    return `<section class="board" id="${c.slug}">
      <div class="bhead"><div class="ico">${iconFor(c.name)}</div><div class="btitle"><h2>${esc(cn(c))}</h2><div class="balt">${esc(c.tr)}</div></div><div class="cnt">${L().n(items.length)}</div></div>
      <ul class="rows">
        ${items.map(it => {
          const id = it.slug;
          return `<li class="row">
            ${it.img?`<button class="thumb" type="button" data-img="${esc(it.img)}" data-name="${esc(nm(it))}" data-opts='${esc(JSON.stringify(it.opts))}'><img src="${esc(it.img)}" alt="" loading="lazy" onerror="imgFail(this)"></button>`:""}
            <div class="nm"><b>${esc(nm(it))}</b><small>${esc(alt(it))}</small></div>
            <div class="opts">
              ${it.opts.map(op => {
                const q = cart[id+":"+op.o]?.q || 0;
                return `<button class="opt ${q>0?"on":""}" type="button" data-add="${id}" data-opt="${esc(op.o)}">
                  ${op.o?`<span class="ol">${esc(ol(op.o))}</span>`:""}
                  <span class="op">${money(op.p)}</span>
                  <span class="plus">+</span>
                  ${q>0?`<span class="qty">${q}</span>`:""}
                </button>`;
              }).join("")}
            </div>
          </li>`;
        }).join("")}
      </ul>
    </section>`;
  }).join("");
  $("#menu").innerHTML = html || `<div class="empty">${esc(L().none(filter))}</div>`;
}

function updateCartUI(){
  let n = 0, sum = 0;
  for(const k in cart){ n += cart[k].q; sum += cart[k].p * cart[k].q; }
  $("#cb-n").textContent = n;
  $("#cb-l").textContent = L().bar;
  $("#cb-s").textContent = money(sum);
  $("#cartbar").hidden = n === 0;
  store.set("cart", cart);
}
function toast(msg){
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"), 1800);
}

function findItem(slug){
  for(const c of CATS){ for(const it of c.items){ if (it.slug===slug) return it; } }
  return null;
}

document.addEventListener("click", e => {
  const addBtn = e.target.closest("[data-add]");
  if (addBtn){
    const slug = addBtn.dataset.add, opt = addBtn.dataset.opt;
    const it = findItem(slug); if(!it) return;
    const op = it.opts.find(x => x.o === opt); if(!op) return;
    const key = slug + ":" + opt;
    if(!cart[key]) cart[key] = {slug, o:opt, n:nm(it), p:op.p, q:0};
    cart[key].q++;
    updateCartUI();
    renderMenu($("#q").value);
    toast(L().added(nm(it) + (opt?" ("+ol(opt)+")":"")));
    return;
  }
  const thumb = e.target.closest("[data-img]");
  if (thumb){
    $("#v-img").src = thumb.dataset.img;
    $("#v-name").textContent = thumb.dataset.name;
    const opts = JSON.parse(thumb.dataset.opts||"[]");
    $("#v-opts").innerHTML = opts.map(op => `<span class="opt" style="cursor:default">${op.o?`<span class="ol">${esc(ol(op.o))}</span>`:""}<span class="op">${money(op.p)}</span></span>`).join("");
    $("#img-scrim").hidden = false; requestAnimationFrame(()=>$("#img-scrim").classList.add("show"));
    return;
  }
  if (e.target.closest("[data-close]")){
    document.querySelectorAll(".scrim").forEach(el => {
      el.classList.remove("show"); setTimeout(()=>el.hidden=true, 200);
    });
    return;
  }
  if (e.target.closest("button[data-lang]")){
    lang = e.target.closest("button[data-lang]").dataset.lang;
    store.set("lang", lang); location.hash = lang; initUI();
    return;
  }
});

function renderCartModal(){
  const L_ = L();
  $("#c-title").textContent = L_.cart;
  $("#c-clear").textContent = L_.clear;
  $("#l-table").textContent = L_.table;
  $("#l-name").textContent = L_.nameL;
  $("#l-addr").textContent = L_.addr;
  $("#l-note").textContent = L_.note;
  $("#c-send-t").textContent = L_.send;
  $("#c-hint").textContent = L_.hint;

  $("#f-table").hidden = orderType !== "table";
  $("#f-adr").hidden = orderType !== "delivery";

  $("#c-type").innerHTML = Object.keys(L_.types).map(k => `<button type="button" data-type="${k}" aria-pressed="${orderType===k}">${L_.types[k]}</button>`).join("");

  let sum = 0, linesHtml = "";
  for(const k in cart){
    const item = cart[k]; sum += item.p * item.q;
    linesHtml += `<li class="line">
      <div class="ln"><b>${esc(item.n)}</b>${item.o?`<small>${esc(ol(item.o))}</small>`:""}<small>${money(item.p)}</small></div>
      <div class="step">
        <button type="button" data-dec="${k}">-</button>
        <b>${item.q}</b>
        <button type="button" data-inc="${k}">+</button>
      </div>
    </li>`;
  }
  $("#c-lines").innerHTML = linesHtml || `<li class="empty">${esc(L_.empty)}</li>`;
  $("#t-total").textContent = L_.total;
  $("#c-sum").textContent = money(sum);
  $("#c-nowa").hidden = !!S.wa;
  if(!S.wa){ $("#c-nowa").textContent = L_.nowa; $("#c-send").setAttribute("disabled", "disabled"); }
  else { $("#c-send").removeAttribute("disabled"); }
}

document.addEventListener("click", e => {
  const dt = e.target.closest("[data-type]");
  if (dt){ orderType = dt.dataset.type; store.set("type", orderType); renderCartModal(); return; }
  const inc = e.target.closest("[data-inc]");
  if (inc){ const k = inc.dataset.inc; if(cart[k]) cart[k].q++; updateCartUI(); renderCartModal(); renderMenu($("#q").value); return; }
  const dec = e.target.closest("[data-dec]");
  if (dec){ const k = dec.dataset.dec; if(cart[k]){ cart[k].q--; if(cart[k].q<=0) delete cart[k]; } updateCartUI(); renderCartModal(); renderMenu($("#q").value); if(Object.keys(cart).length===0) $("#cart-scrim").classList.remove("show"); return; }
});

$("#c-send").addEventListener("click", () => {
  const L_ = L();
  const table = $("#in-table").value.trim();
  const name = $("#in-name").value.trim();
  const addr = $("#in-addr").value.trim();
  const note = $("#in-note").value.trim();

  if(orderType==="table" && !table){ $("#f-table").classList.add("bad"); toast(L_.need); return; } else $("#f-table").classList.remove("bad");
  if(orderType==="delivery" && !addr){ $("#f-adr").classList.add("bad"); toast(L_.need); return; } else $("#f-adr").classList.remove("bad");

  let text = `*${L_.msgHead}*\n\n🔹 *${L_.msgType}:* ${L_.types[orderType]}\n`;
  if(orderType==="table" && table) text += `📌 *${L_.msgTable}:* ${table}\n`;
  if(name) text += `👤 *${L_.msgName}:* ${name}\n`;
  if(orderType==="delivery" && addr) text += `📍 *${L_.msgAddr}:* ${addr}\n`;
  if(note) text += `📝 *${L_.msgNote}:* ${note}\n`;

  text += `\n------------------\n`;
  let sum = 0;
  for(const k in cart){
    const i = cart[k];
    text += `▪️ ${i.q}x ${i.n} ${i.o? "("+ol(i.o)+")":""} - ${money(i.p * i.q)}\n`;
    sum += i.p * i.q;
  }
  text += `------------------\n`;
  text += `💰 *${L_.msgTotal}:* ${money(sum)}`;

  window.open(`https://wa.me/${S.wa}?text=${encodeURIComponent(text)}`, "_blank");
});

document.addEventListener("scroll", () => {
  let cur = "";
  document.querySelectorAll("section.board").forEach(sec => {
    if (window.scrollY >= sec.offsetTop - 120) cur = sec.id;
  });
  document.querySelectorAll(".tab").forEach(tab => {
    if (tab.dataset.to === cur) tab.setAttribute("aria-current", "true");
    else tab.removeAttribute("aria-current");
  });
});

$("#tabs").addEventListener("click", e => {

});

function initUI(){
  const L_ = L();
  document.documentElement.lang = lang;
  document.documentElement.dir = L_.dir;
  $("#t-hi").textContent = L_.hi;
  $("#t-tag").textContent = L_.tag;
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));

  const isOpen = true; 
  const statusEl = $("#status");
  statusEl.hidden = false;
  statusEl.className = "pill " + (isOpen ? "is-open" : "is-closed");
  $("#status-t").textContent = isOpen ? L_.open(S.close) : L_.closed(S.open);

  if(S.address){ $("#addr-pill").hidden = false; $("#addr-pill").href = S.map; $("#addr-t").textContent = S.address; }

  $("#q").placeholder = L_.search;

  // جلب البيانات مباشرة من جوجل شيت مع متغير الوقت لمنع الكاش
  const freshUrl = `${SHEET_CSV}&t=${Date.now()}`;
  fetch(freshUrl)
    .then(res => res.text())
    .then(text => {
      const rows = parseCSV(text);
      build(rows);
      renderTabs();
      renderMenu($("#q").value);
      updateCartUI();
    })
    .catch(err => {
      console.error("فشل جلب بيانات الشيت:", err);
      $("#menu").innerHTML = `<div class="empty">عذراً، حدث خطأ في تحميل المنيو من جوجل شيت.</div>`;
    });

  if(S.hours || S.open){
    $("#f-hours").hidden = false;
    $("#t-hours-h").textContent = L_.hoursH;
    $("#t-hours").textContent = L_.hours(S.open, S.close);
  }
  if(S.address){
    $("#f-addr").hidden = false;
    $("#t-addr-h").textContent = L_.addrH;
    $("#f-addr-t").textContent = S.address;
    if(S.map){ $("#f-map").hidden = false; $("#f-map").href = S.map; $("#f-map").textContent = L_.map; }
  }
  if(S.phone){
    $("#f-contact").hidden = false;
    $("#t-contact-h").textContent = L_.contactH;
    $("#f-contact-t").textContent = `${L_.phone}: ${S.phone} | ${L_.wa}: ${S.wa}`;
  }
  if(S.instagram || S.facebook){
    $("#f-social").hidden = false;
    $("#t-follow").textContent = L_.follow;
    let sHtml = "";
    if(S.instagram) sHtml += `<a class="pill" href="${S.instagram}" target="_blank" rel="noopener">Instagram</a>`;
    if(S.facebook) sHtml += `<a class="pill" href="${S.facebook}" target="_blank" rel="noopener">Facebook</a>`;
